<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NB Food Index</title>
<style>
  :root{
    --bg:#F3F6F4; --card:#FFF; --ink:#1F2E29; --muted:#5D6D67; --line:#DCE4E0;
    --accent:#166A4B; --accent-ink:#FFF; --strong:#1B7A52; --strong-bg:#E4F2EB;
    --trap:#AE3B31; --trap-bg:#F7E8E6; --ok:#6B7A74; --ok-bg:#ECF0EE;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121917; --card:#1B2421; --ink:#E6EDEA; --muted:#95A59E; --line:#2B3733;
      --accent:#4CC392; --accent-ink:#0E1613; --strong:#57C795; --strong-bg:#1D302A;
      --trap:#E2695E; --trap-bg:#37211F; --ok:#8A9992; --ok-bg:#232D2A;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,"Segoe UI",sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:26px;margin:0 0 2px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 16px;font-size:13.5px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  input[type=search]{flex:1 1 200px;padding:8px 12px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-left:1px solid var(--line);background:transparent;
    color:var(--muted);padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  label.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;
    color:var(--muted);cursor:pointer;padding:7px 4px}
  .count{color:var(--muted);font-size:12.5px;margin:0 0 10px;
    font-variant-numeric:tabular-nums}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:13px 15px}
  .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .top h3{margin:0;font-size:16px}
  .walk{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .meta a{color:inherit}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .b{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;
    background:var(--ok-bg);color:var(--ok);letter-spacing:.02em}
  .b.strong{background:var(--strong-bg);color:var(--strong)}
  .b.trap{background:var(--trap-bg);color:var(--trap)}
  .b.price{font-variant-numeric:tabular-nums}
  .b.good{background:var(--strong-bg);color:var(--strong)} .b.warn{background:#F6EEDC;color:#8A5A00} .b.bad{background:var(--trap-bg);color:var(--trap)}
  @media (prefers-color-scheme: dark){ .b.warn{background:#3A2E14;color:#F0C060} }
  .notes{margin:8px 0 0;font-size:13.5px;max-width:64ch}
  .verified{color:var(--muted);font-size:11.5px;margin-top:6px}
  .empty{color:var(--muted);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>NB Food Index</h1>
  <p class="sub">Every restaurant, cafe &amp; grocery within a walk of 371 Columbus — North Beach, Chinatown, Fisherman's Wharf, Russian Hill · walk times from your door · curated notes, SF DPH inspection results, 150 m street-risk percentile from SFPD incidents, and menus where found</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Search name, cuisine, notes…">
    <span class="seg" id="cat">
      <button data-v="" class="on">All</button><button data-v="restaurant">Restaurants</button><button data-v="cafe">Cafes</button><button data-v="grocery">Groceries</button>
    </span>
    <span class="seg" id="health">
      <button data-v="" class="on">Any</button><button data-v="strong">Healthy picks</button>
    </span>
    <span class="seg" id="nhood">
      <button data-v="" class="on">All</button><button data-v="North Beach">North Beach</button><button data-v="Chinatown">Chinatown</button><button data-v="Fisherman's Wharf">Fisherman's Wharf</button><button data-v="Russian Hill">Russian Hill</button>
    </span>
    <label class="tog"><input type="checkbox" id="curated"> curated only</label>
    <label class="tog"><input type="checkbox" id="hasmenu"> has menu</label>
  </div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
</div>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function price(p){return p ? "$".repeat(p) : "";}

function row(p){
  const badges = [];
  if(p.price) badges.push(`<span class="b price">${price(p.price)}</span>`);
  if(p.health==="strong") badges.push('<span class="b strong">healthy pick</span>');
  if(p.health==="trap") badges.push('<span class="b trap">treat / trap</span>');
  if(p.laptops) badges.push('<span class="b">laptops</span>');
  if(p.applePay===true) badges.push('<span class="b strong">apple pay</span>');
  if(p.applePay===false) badges.push('<span class="b trap">cash only</span>');
  if(p.cuisine) badges.push(`<span class="b">${esc(p.cuisine)}</span>`);
  if(p.inspection){ const I=p.inspection; const conf=I.match_confidence==="name-only"?" (name match)":"";
    if(I.last_status){ const st=String(I.last_status).toUpperCase(); const cls=st.startsWith("PASS")?"good":st.includes("CONDITIONAL")?"warn":"bad";
      badges.push(`<span class="b ${cls}" title="SF DPH placard result, ${esc(I.last_inspection_type||"inspection")} on ${esc(I.last_status_date||I.last_inspection_date||"")}; ${I.violation_count_last??"?"} violations; ${I.closures_all_time||0} closures / ${I.conditional_pass_all_time||0} conditional passes on record${conf}">DPH ${esc(st.replace("CONDITIIONAL","CONDITIONAL").toLowerCase())} · ${esc(String(I.last_status_date||I.last_inspection_date||"").slice(0,7))}${I.violation_count_last?` · ${I.violation_count_last} viol`:""}</span>`); }
    if(I.last_score!=null){ const sc=I.last_score; const cls=sc>=90?"good":sc>=80?"warn":"bad";
      badges.push(`<span class="b ${cls}" title="Numeric score era (2016-2019)${conf}">score ${sc} · ${esc(String(I.last_score_date||"").slice(0,4))}</span>`); } }
  if(p.risk && p.risk.percentile!=null){ const pc=p.risk.percentile; const cls=pc>=75?"bad":pc>=40?"warn":"good";
    badges.push(`<span class="b ${cls}" title="SFPD incidents within 150 m, trailing 365 d: ${p.risk.violent} violent / ${p.risk.property} property / ${p.risk.drug} drug">street risk p${Math.round(pc)} · ${p.risk.per_month}/mo</span>`); }
  if(p.menu_data && p.menu_data.url) badges.push(`<a class="b" href="${esc(p.menu_data.url)}" target="_blank" rel="noopener">menu${p.menu_data.items?` (${p.menu_data.items} items)`:""}</a>`);
  const meta = [p.neighborhood, p.addr, p.hours].filter(Boolean).map(esc).join(" · ");
  const site = p.website ? ` · <a href="${esc(p.website)}" target="_blank" rel="noopener">site</a>` : "";
  const menu = p.menu ? ` · <a href="../${esc(p.menu)}" target="_blank">menu</a>` : "";
  return `<div class="card">
    <div class="top"><h3>${esc(p.name)}</h3><span class="walk">${p.walkMin} min walk</span></div>
    ${meta||site||menu ? `<div class="meta">${meta}${site}${menu}</div>` : ""}
    ${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}
    ${p.notes ? `<p class="notes">${esc(p.notes)}</p>` : ""}
    ${p.verified ? `<div class="verified">verified ${esc(p.verified)}</div>` : ""}
  </div>`;
}

function apply(){
  const cur = $("curated").checked;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = DATA.filter(p=>{
    if(cat && p.category!==cat) return false;
    if(health && p.health!==health) return false;
    if(nhood && p.neighborhood!==nhood) return false;
    if(cur && !p.notes) return false;
    if($("hasmenu").checked && !p.menu_data) return false;
    if(words.length){
      const hay = (p.name+" "+(p.cuisine||"")+" "+(p.notes||"")+" "+(p.subtype||"")).toLowerCase();
      if(!words.every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  $("count").textContent = rows.length + " places, nearest first";
  $("list").innerHTML = rows.map(row).join("") || '<p class="empty">Nothing matches.</p>';
}

for(const segId of ["cat","health"]){
  $(segId).addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    [...$(segId).children].forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    if(segId==="cat") cat = b.dataset.v; else health = b.dataset.v;
    apply();
  });
}
$("nhood").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  [...$("nhood").children].forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); nhood = b.dataset.v; apply();
});
$("q").addEventListener("input", e=>{q=e.target.value; apply();});
$("curated").addEventListener("change", apply);
$("hasmenu").addEventListener("change", apply);
apply();
</script>
</body>
</html>
